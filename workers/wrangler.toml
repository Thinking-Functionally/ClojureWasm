# Cloudflare Workers Configuration for ClojureWasm
name = "clojurewasm-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# Worker 類型（module format 支持 ES6 imports）
[build]
command = ""

[build.upload]
format = "modules"
dir = "."
main = "./worker.js"

# Wasm 模組綁定
# 將你嘅 .wasm 檔案放到 workers/ 目錄，然後更新呢個 rule
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# 本地開發配置
[env.dev]
name = "clojurewasm-worker-dev"

# 生產環境配置
[env.production]
name = "clojurewasm-worker-prod"

# 如果需要環境變數，可以喺呢度加：
# [vars]
# MY_VAR = "value"

# 如果需要 KV/R2/D1 等 Cloudflare 服務，可以喺呢度配置
